<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>passwords · Flavia Gaglio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Silkscreen&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --te-border: #1a1a1a;
            --te-btn-gray: #ccc7b8;
            --te-chassis: #e5e1d5;
            --te-cream-bg: #f2efe6;
            --te-dark: #121315;
            --te-lcd-bg: #222623;
            --te-lcd-text: #50ff40;
            --te-orange: #ff4400;
            --te-panel: #dcd7c8;
            --te-red: #e57373;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-lcd: 'Silkscreen', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        body {
            background: var(--te-cream-bg);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--te-dark);
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--te-chassis);
            border: 3px solid var(--te-border);
            box-shadow: 8px 8px 0 var(--te-dark);
            padding: 2rem;
            color: var(--te-dark);
        }

        h1 {
            font-family: var(--font-mono);
            font-size: 2.4rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 6px;
            color: var(--te-dark);
        }

        .byline {
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--te-dark);
            opacity: 0.65;
            margin-bottom: 1.5rem;
            margin-top: 0.4rem;
        }

        .byline a {
            color: inherit;
            text-decoration: underline;
            text-decoration-color: currentColor;
            text-underline-offset: 2px;
        }

        .byline a:hover {
            color: var(--te-orange);
        }

        .glass-panel {
            background: var(--te-panel);
            border: 2px solid var(--te-border);
            padding: 1.5rem;
            margin: 1.5rem 0;
        }

        .password-display {
            background: var(--te-lcd-bg);
            border: 3px solid var(--te-border);
            padding: 1.5rem;
            font-size: 1.7rem;
            font-family: var(--font-mono);
            font-weight: 700;
            word-break: break-all;
            text-align: center;
            color: var(--te-lcd-text);
            margin-bottom: 1.25rem;
            position: relative;
        }

        .password-display.flicker {
            animation: flicker 0.25s steps(2);
        }

        @keyframes flicker {
            0% { opacity: 1; }
            40% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .slider-label {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--te-dark);
        }

        .slider-label span#lengthValue {
            font-family: var(--font-lcd);
            background: var(--te-lcd-bg);
            color: var(--te-lcd-text);
            padding: 0.15rem 0.6rem;
            border: 2px solid var(--te-border);
            font-size: 1.1rem;
        }

        input[type=range] {
            width: 100%;
            height: 18px;
            background: var(--te-cream-bg);
            border: 2px solid var(--te-border);
            outline: none;
            -webkit-appearance: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 32px;
            background: var(--te-orange);
            border: 2px solid var(--te-border);
            box-shadow: 3px 3px 0 var(--te-border);
            cursor: pointer;
        }

        input[type=range]::-moz-range-thumb {
            width: 22px;
            height: 32px;
            background: var(--te-orange);
            border: 2px solid var(--te-border);
            box-shadow: 3px 3px 0 var(--te-border);
            cursor: pointer;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .checkbox-item input[type=checkbox] {
            width: 18px;
            height: 18px;
            accent-color: var(--te-orange);
        }

        .strength-meter {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem 1rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .strength-bar {
            flex: 1 1 140px;
            height: 18px;
            background: var(--te-btn-gray);
            border: 2px solid var(--te-border);
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            background: var(--te-orange);
            transition: width 0.2s;
        }

        #entropyValue {
            font-family: var(--font-lcd);
            background: var(--te-lcd-bg);
            color: var(--te-lcd-text);
            padding: 0.15rem 0.5rem;
            border: 2px solid var(--te-border);
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cyber-button {
            background: var(--te-btn-gray);
            color: var(--te-dark);
            border: 2px solid var(--te-border);
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: var(--font-mono);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            position: relative;
            transition: 0.08s;
            box-shadow: 4px 4px 0 var(--te-border);
            flex: 1 1 auto;
            min-width: 200px;
        }

        .cyber-button:hover {
            background: var(--te-orange);
            color: var(--te-cream-bg);
        }

        .cyber-button:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--te-dark);
            opacity: 0.55;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-top: 2px solid var(--te-border);
            padding-top: 1rem;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.7rem; }
            .password-display { font-size: 1.1rem; }
            .checkbox-group { grid-template-columns: 1fr; }
            .cyber-button { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PASSWORDS</h1>
        <div class="byline">by <a href="https://flaviagaglio.github.io" target="_blank" rel="noopener">Flavia Gaglio</a></div>

        <div class="glass-panel">
            <div class="password-display" id="passwordDisplay">CLICK GENERATE</div>

            <div class="controls">
                <div class="slider-container">
                    <div class="slider-label">
                        <span>LUNGHEZZA</span>
                        <span id="lengthValue">16</span>
                    </div>
                    <input type="range" id="lengthSlider" min="8" max="64" value="16">
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="useUpper" checked> MAIUSCOLE
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="useLower" checked> MINUSCOLE
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="useNumbers" checked> NUMERI
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="useSymbols" checked> SIMBOLI
                    </label>
                </div>

                <div class="strength-meter">
                    <span>FORZA</span>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill" style="width: 0%;"></div>
                    </div>
                    <span id="entropyValue">0 bit</span>
                </div>

                <div class="button-group">
                    <button class="cyber-button" id="generateBtn">GENERA</button>
                    <button class="cyber-button" id="copyBtn">COPIA</button>
                </div>
            </div>
        </div>

        <div class="footer">

        </div>
    </div>

    <script>
        (function() {
            // Elementi DOM
            const passwordDisplay = document.getElementById('passwordDisplay');
            const lengthSlider = document.getElementById('lengthSlider');
            const lengthValue = document.getElementById('lengthValue');
            const useUpper = document.getElementById('useUpper');
            const useLower = document.getElementById('useLower');
            const useNumbers = document.getElementById('useNumbers');
            const useSymbols = document.getElementById('useSymbols');
            const generateBtn = document.getElementById('generateBtn');
            const copyBtn = document.getElementById('copyBtn');
            const strengthFill = document.getElementById('strengthFill');
            const entropyValue = document.getElementById('entropyValue');

            // Set di caratteri
            const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const LOWER = 'abcdefghijklmnopqrstuvwxyz';
            const NUMBERS = '0123456789';
            const SYMBOLS = '!@#$%^&*()_+[]{}|;:,.<>?';

            const REFERENCE_BITS = 128;

            function secureRandomInt(maxExclusive) {
                if (!window.crypto || !window.crypto.getRandomValues) {
                    throw new Error('Web Crypto API non disponibile');
                }
                const range = maxExclusive;
                const maxUint32 = 0x100000000;
                const limit = maxUint32 - (maxUint32 % range);
                const buf = new Uint32Array(1);
                let value;
                do {
                    window.crypto.getRandomValues(buf);
                    value = buf[0];
                } while (value >= limit);
                return value % range;
            }

            // Aggiorna valore slider
            lengthSlider.addEventListener('input', () => {
                lengthValue.textContent = lengthSlider.value;
                updateStrength();
            });

            function getPoolSize(charSets) {
                let size = 0;
                if (charSets.upper) size += UPPER.length;
                if (charSets.lower) size += LOWER.length;
                if (charSets.numbers) size += NUMBERS.length;
                if (charSets.symbols) size += SYMBOLS.length;
                return size;
            }

            // Entropia = lunghezza * log2(dimensione alfabeto)
            function calculateEntropyBits(length, poolSize) {
                if (poolSize <= 1) return 0;
                return length * Math.log2(poolSize);
            }

            // Aggiorna barra della forza
            function updateStrength() {
                const length = parseInt(lengthSlider.value);
                const charSets = {
                    upper: useUpper.checked,
                    lower: useLower.checked,
                    numbers: useNumbers.checked,
                    symbols: useSymbols.checked
                };
                const poolSize = getPoolSize(charSets);
                const bits = calculateEntropyBits(length, poolSize);
                const percent = Math.min(100, (bits / REFERENCE_BITS) * 100);
                strengthFill.style.width = percent + '%';
                entropyValue.textContent = Math.round(bits) + ' bit';
                if (percent < 35) strengthFill.style.background = 'var(--te-red)';
                else if (percent < 70) strengthFill.style.background = 'var(--te-orange)';
                else strengthFill.style.background = 'var(--te-lcd-text)';
            }

            // Genera password
            function generatePassword() {
                let chars = '';
                if (useUpper.checked) chars += UPPER;
                if (useLower.checked) chars += LOWER;
                if (useNumbers.checked) chars += NUMBERS;
                if (useSymbols.checked) chars += SYMBOLS;

                if (chars === '') {
                    alert('Seleziona almeno un tipo di carattere!');
                    return '';
                }

                const length = parseInt(lengthSlider.value);
                let password = '';
                for (let i = 0; i < length; i++) {
                    const randomIndex = secureRandomInt(chars.length);
                    password += chars[randomIndex];
                }
                return password;
            }

            // Mostra password con effetto flicker
            function displayWithGlitch(pwd) {
                passwordDisplay.textContent = pwd;
                passwordDisplay.classList.add('flicker');
                setTimeout(() => {
                    passwordDisplay.classList.remove('flicker');
                }, 250);
            }

            // Evento genera
            generateBtn.addEventListener('click', () => {
                const pwd = generatePassword();
                if (pwd) displayWithGlitch(pwd);
                updateStrength();
            });

            // Evento copia
            copyBtn.addEventListener('click', () => {
                const pwd = passwordDisplay.textContent;
                if (pwd && pwd !== 'CLICK GENERATE') {
                    navigator.clipboard.writeText(pwd).then(() => {
                        // feedback visivo
                        passwordDisplay.style.background = '#2f7d3a';
                        setTimeout(() => {
                            passwordDisplay.style.background = '';
                        }, 200);
                    }).catch(err => {
                        alert('Errore nella copia');
                    });
                }
            });

            // Inizializza prima password
            (function init() {
                const pwd = generatePassword();
                if (pwd) passwordDisplay.textContent = pwd;
                updateStrength();
            })();

            // Aggiorna forza al cambio delle checkbox
            [useUpper, useLower, useNumbers, useSymbols].forEach(cb => {
                cb.addEventListener('change', updateStrength);
            });
        })();
    </script>
</body>
</html>
